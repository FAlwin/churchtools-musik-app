<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!--
      iOS 26/27 und die Kopfzeile (21./22.09.2026, gemeldet von Alwin mit Screenshots):
      Seit iOS 26 legt das System über den Bereich HINTER der Statusleiste den „Scroll-Edge-Effekt"
      von Liquid Glass – ein Unschärfe-Band, das ein, zwei Zeilen unter der Statusleiste ausläuft;
      iOS 27 hat es deutlich kräftiger gemacht. Jede Web-App, die mit `black-translucent` +
      `viewport-fit=cover` unter der Statusleiste zeichnet, bekommt dort verschmierten Text. Es gibt
      keinen Schalter dagegen (kein CSS, kein Meta), und `env(safe-area-inset-top)` wächst nicht mit.
      Der einzige Hebel: dort nichts mehr hinzeichnen. Mit `default` rückt iOS die Web-Ansicht unter
      eine deckende Statusleiste, die es aus `theme-color` färbt – deshalb steht die je Farbschema in
      der Farbe unserer Kopfleiste (hell: Weiß; dunkel: die Kartenfarbe, die die Leiste über dem
      Seitenhintergrund ergibt), sonst säße ein blauer Balken über einer grauen Leiste.
      `viewport-fit=cover` bleibt: Es wird für den unteren Rand (Home-Indikator) weiter gebraucht.
      Folge: `env(safe-area-inset-top)` ist in der installierten App jetzt 0, die Kopfzeile fällt auf
      ihre Mindesthöhe (20 px, NavBar.module.scss) zurück. Die Angabe wird beim Hinzufügen zum
      Home-Bildschirm gelesen – eine bestehende Verknüpfung zeigt die Änderung erst nach Löschen und
      Neu-Hinzufügen, und der Service Worker muss vorher die neue Startseite haben.
      Quellen: dozzle#5222, vcsudoku#38, hypersweeper#145, ioBroker.aura#662 (alle 2026).
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e2a35" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Name, den iOS beim „Zum Home-Bildschirm" vorschlägt -->
    <meta name="apple-mobile-web-app-title" content="Churchtools Musik App" />
    <title>Churchtools Musik App</title>
    <!-- Kein Web-Font: die App nutzt durchgängig den System-Font (var(--ui)). -->
  </head>
  <body>
    <!-- Boot-Fallback: sofort sichtbar, BEVOR das App-JS lädt/startet. React (createRoot) ersetzt
         diesen Inhalt beim ersten Rendern. Bleibt er stehen (App-JS lädt nicht / Startfehler),
         sieht man statt eines WEISSEN Bildschirms eine Meldung – und nach kurzer Zeit einen
         Nachlade-Knopf. Alles inline (Styles + Skript), damit es auch ohne geladenes CSS/JS wirkt;
         index.html liegt im Offline-Precache → funktioniert auch ohne Netz. (#32) -->
    <div id="root">
      <div
        id="boot-fallback"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          font-family:
            system-ui,
            -apple-system,
            sans-serif;
          color: #667;
          background: #f5f6f8;
          padding: 24px;
          text-align: center;
        "
      >
        <div id="boot-msg" style="font-size: 15px">Einen Moment…</div>
        <button
          id="boot-reload"
          style="
            display: none;
            padding: 10px 20px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
          "
        >
          Neu laden
        </button>
      </div>
    </div>
    <script>
      // Startet die App ungewöhnlich lange nicht (hängend/fehlender App-Code), eine verständliche
      // Meldung + Nachlade-Knopf zeigen – statt eines weißen Bildschirms. Verschwindet automatisch,
      // sobald React rendert (ersetzt den #root-Inhalt). (#32)
      setTimeout(function () {
        var msg = document.getElementById('boot-msg');
        var btn = document.getElementById('boot-reload');
        if (!msg || !btn) return; // App läuft längst
        msg.textContent = 'Das dauert länger als üblich. Bei bestehender Verbindung hilft Neu laden.';
        btn.style.display = '';
        btn.addEventListener('click', function () {
          location.reload();
        });
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
