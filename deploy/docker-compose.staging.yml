# Test-Instanz (Staging) – fertiges :staging-Image aus GHCR, KEIN lokaler Build.
# Läuft parallel neben der Live-App auf einem eigenen Port + eigenem Volume, damit neue
# Versionen gefahrlos getestet werden können, bevor sie in Produktion gehen.
#
# Watchtower zieht neue :staging-Images automatisch (Auto-Deploy) → kein Rebuild im Container-Manager.
# Hinweis: Hier läuft bewusst der GEPFLEGTE Watchtower-Fork (nickfedor/watchtower), da das
# Original containrrr/watchtower unmaintained und mit Docker 28/29+ inkompatibel ist. Drop-in:
# gleiche Labels (com.centurylinklabs.watchtower.*) und Flags (--interval/--cleanup/--scope).
# NUR die Test-Instanz zieht automatisch; Prod (docker-compose.prod.yml) aktualisiert bewusst.
#
# ⚠️ BEWUSST EINGEGANGENES RISIKO (#196): Watchtower braucht den Docker-Socket, und ein Container mit
# Socket-Zugriff kann auf dem NAS alles tun, was root kann. Abgemildert durch: festen Image-Digest
# (unten), eigener Scope (nur die Test-Container), und der Socket ist nur hier eingebunden – Prod
# hat ihn NICHT. Wer das nicht will, lässt den Watchtower-Dienst weg und zieht Staging von Hand:
#   sudo docker compose -f docker-compose.staging.yml pull && … up -d
#
# Einrichtung im Synology Container-Manager:
#   1. Neues Projekt aus DIESER Datei + einer Test-.env erstellen (eigene, von Prod getrennte
#      CHURCHTOOLS_BASE_URL/SESSION_SECRET sind empfehlenswert).
#   2. Reverse Proxy auf eine Test-Domain → 127.0.0.1:3002 (PFLICHT, nicht optional – seit #196
#      lauscht der Port nur lokal und COOKIE_SECURE ist standardmäßig an).
#   3. Volume worship-data-test enthält die Test-Daten (Anmerkungen/Einstellungen) – BEHALTEN.
#   4. Fertig: ab jetzt zieht Watchtower nach jedem Push (sobald die CI das Image gebaut hat)
#      automatisch die neue Version (Prüfintervall 60 s).
# Projektname FEST verdrahtet (siehe docker-compose.prod.yml): fixiert den Volume-Präfix
# `<projektname>_<volume-key>`, damit ein abweichender Container-Manager-Projektname nicht ein
# neues, leeres Volume erzeugt. ⚠️ Einmal gesetzt NIE ändern. ECG-Test = `worship-charts-test`.
name: worship-charts-test
services:
  app:
    image: ghcr.io/falwin/churchtools-musik-app:staging
    container_name: musik-app-test
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CHURCHTOOLS_BASE_URL: ${CHURCHTOOLS_BASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_PERMISSION: ${ADMIN_PERMISSION:-churchcore:administer persons}
      # Sicher als Standard (#196): Das Cookie darf nur über HTTPS übertragen werden. Setzt den
      # Reverse Proxy voraus (siehe Einrichtung unten) – ohne HTTPS speichert der Browser das Cookie
      # nicht und die Anmeldung schlägt fehl. Nur für einen bewussten Test ohne Proxy:
      # COOKIE_SECURE=false in der Test-.env.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      # NUR lokal binden (#196) – wie Prod. Vorher lauschte der Port auf ALLEN Interfaces: Das
      # Session-Cookie (mit der ChurchTools-Anmeldung darin) lief damit unverschlüsselt über HTTP
      # durchs LAN. Zugriff jetzt ausschließlich über den Reverse Proxy mit HTTPS.
      - '127.0.0.1:3002:3001'
    volumes:
      - worship-data-test:/app/data
    labels:
      # Nur von der Test-Watchtower verwaltet (Prod bleibt unangetastet).
      - com.centurylinklabs.watchtower.scope=musik-app-test

  watchtower:
    # Auf einen festen Digest gepinnt (#196): Dieser Container hat über den Docker-Socket
    # root-äquivalenten Zugriff auf das NAS. Ein bewegliches `:latest` würde jede neue Fassung des
    # Fremd-Images ungeprüft mit diesen Rechten ausführen. Aktualisieren also bewusst und von Hand –
    # neuen Digest holen und hier eintragen.
    image: nickfedor/watchtower@sha256:696a5fb17b9a2e5e04a4e56daedcf88cc4e4fb95c673b8937063f493e2f63ad4
    container_name: musik-app-watchtower-test
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Alle 60 s prüfen, nur Container mit Scope 'musik-app-test', alte Images aufräumen.
    command: --interval 60 --cleanup --scope musik-app-test
    labels:
      - com.centurylinklabs.watchtower.scope=musik-app-test

volumes:
  # Persistente Test-Daten (Anmerkungen/Einstellungen/site.json). Hinweis: Wird beim Neu-Erstellen
  # des Projekts ggf. neu angelegt → orgName ggf. einmal neu setzen; Geräte-Anmerkungen werden beim
  # ersten Öffnen erneut hochgeladen. Der Volume-Name bleibt bewusst `worship-data-test`, damit
  # bestehende Instanzen ihre Daten ohne Umkopieren behalten.
  worship-data-test:
