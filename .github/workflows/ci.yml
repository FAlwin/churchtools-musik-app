name: CI

# Läuft bei jedem Push auf main und bei jedem Pull Request.
# Kein DB-Service nötig: ChurchTools ist die Datenquelle, die App hat keine eigene DB.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Formatierung zuerst: billigster Schritt, und ein Format-Diff macht jede spätere
      # Fehlermeldung schwerer lesbar. ESLint prüft Formatierung NICHT (eslint-config-prettier
      # schaltet die Regeln ab) – ohne diesen Schritt driftet der Stil unbemerkt weiter.
      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      # Zwei Ebenen: Render-Smoke (?demo=chart, ohne Backend) UND der volle Auth-Flow gegen den
      # ChurchTools-Stub (#174) – Playwright startet Stub, Server und Client selbst.
      - name: E2E (Render-Smoke + Auth-Flow gegen CT-Stub)
        run: npm run test:e2e
