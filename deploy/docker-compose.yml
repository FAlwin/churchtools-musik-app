# Fertiges Image aus der GitHub Container Registry – KEIN lokaler Build nötig.
#
# So nutzt ihr es: diese Datei + eine .env (siehe .env.example) in einen Ordner
# legen und starten mit:  docker compose up -d
# Updates: siehe UPDATE.md.
# Projektname fest verdrahtet: fixiert den Volume-Präfix `<projektname>_<volume-key>`, damit die
# App auch dann dasselbe Datenvolume behält, wenn beim (Neu-)Anlegen im Container Manager ein
# abweichender Projektname vergeben würde. ⚠️ Einmal gesetzt NIE ändern (sonst neues leeres Volume).
name: churchtools-musik-app
services:
  app:
    # :2 = automatisch alle Updates der Version 2 (neue Funktionen + Bugfixes), aber KEIN
    # ungewollter Sprung auf eine größere Umstellung (v3). Empfohlen für Gemeinden.
    #   - Ganz feste Version (volle Kontrolle):   ...churchtools-musik-app:2.1.7
    #   - Immer das Allerneueste (inkl. v3 usw.):  ...churchtools-musik-app:latest
    image: ghcr.io/falwin/churchtools-musik-app:2
    container_name: churchtools-musik-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CHURCHTOOLS_BASE_URL: ${CHURCHTOOLS_BASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_PERMISSION: ${ADMIN_PERMISSION:-churchcore:administer persons}
    ports:
      # links = Host-Port (bei Bedarf ändern), rechts = im Container fest auf 3001.
      #
      # Hier BEWUSST auf allen Schnittstellen (anders als `docker-compose.prod.yml`, die nur an
      # 127.0.0.1 bindet): Diese Datei ist der einfache Einstieg – ohne Reverse Proxy erreicht sonst
      # niemand die App, und alle wären ausgesperrt.
      #
      # ⚠️ Sobald ihr einen Reverse Proxy mit HTTPS davorsetzt, stellt beides um (#196). Sonst
      # bleibt die App ZUSÄTZLICH über unverschlüsseltes HTTP im LAN erreichbar, und das
      # Sitzungs-Cookie – darin steckt die ChurchTools-Anmeldung – trägt kein `Secure`-Flag:
      #
      #   ports:      - '127.0.0.1:3001:3001'
      #   environment: COOKIE_SECURE: "true"
      #
      # Schritt für Schritt samt Prüfungen, ob es wirklich greift:
      # docs/betrieb/DEPLOYMENT.md, Abschnitt 3 (Live) bzw. 6 (Test-Instanz).
      - '3001:3001'
    volumes:
      # Persistente Einstellungen (u. a. der Gemeindename). NICHT löschen –
      # sonst sind die Einstellungen nach einem Update weg.
      - musik-data:/app/data

volumes:
  musik-data:
